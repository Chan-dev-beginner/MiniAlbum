<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="./">
  <title>Dreamy Mini Album</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div class="hero-glow"></div>
      <div class="hero-copy">
        <span class="eyebrow">Photo Diary</span>
        <h1>Dreamy Mini Album</h1>
      </div>
    </header>

    <main>
      <section class="gallery-section">
        <div class="gallery-header">
          <div>
            <h2>Captured Moments</h2>
          </div>
        </div>

        <div class="gallery-grid">
          <article class="card animate-card">
            <img src="assets/706524626_1042632668262846_2647405950779677936_n.jpg" alt="Photo 1">
            <div class="card-label">Morning glow</div>
          </article>
          <article class="card animate-card">
            <img src="assets/708832709_980115181653123_8896712598420439711_n.jpg" alt="Photo 2">
            <div class="card-label">Dreamy shadows</div>
          </article>
          <article class="card animate-card">
            <img src="assets/709154504_991739513460138_2147692298926069108_n.jpg" alt="Photo 3">
            <div class="card-label">Soft sunlight</div>
          </article>
          <article class="card animate-card">
            <img src="assets/709225538_986149994168893_1090559585148990177_n.jpg" alt="Photo 4">
            <div class="card-label">Urban details</div>
          </article>
          <article class="card animate-card">
            <img src="assets/709385479_1495764098680934_7110237151561007517_n.jpg" alt="Photo 5">
            <div class="card-label">Quiet perspective</div>
          </article>
          <article class="card animate-card">
            <img src="assets/709762388_857358940763964_3443983487869380164_n.jpg" alt="Photo 6">
            <div class="card-label">Warm tone</div>
          </article>
          <article class="card animate-card">
            <img src="assets/709782226_970590528921347_3500781417889448694_n.jpg" alt="Photo 7">
            <div class="card-label">Evening calm</div>
          </article>
        </div>
      </section>
    </main>

    <footer>
      <p>ICT-CSS 2023-2024</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
